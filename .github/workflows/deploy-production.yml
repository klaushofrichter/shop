name: Deploy production

# Scaffolding until kube-setup has the shop namespaces, the runner and the
# Deployment (made by the Cluster session). The first push to `production` is
# the first deploy; `production` is created and protected then. Adapted from
# klaushofrichter/cams-admin, the other plain-Deployment service with SQLite.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Refuse to deploy anything but production
        if: github.ref != 'refs/heads/production'
        run: |
          echo "::error::deploys run from production only (got ${GITHUB_REF})"
          exit 1
      - uses: actions/checkout@v7
      - name: Generate the version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=America/Chicago date +%Y.%m.%d)
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName')
          TODAY=$(printf '%s\n' "$RELEASES" | grep -c "^v${DATE}\." || true)
          VERSION="${DATE}.$((TODAY + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/klaushofrichter/shop:${{ github.sha }}
            ghcr.io/klaushofrichter/shop:v${{ steps.ver.outputs.version }}
            ghcr.io/klaushofrichter/shop:latest

  deploy:
    needs: build
    runs-on: [self-hosted, k3s]
    environment: production
    permissions:
      contents: read
    outputs:
      generation: ${{ steps.rollout.outputs.generation }}
      served: ${{ steps.smoke.outputs.served }}
    steps:
      - name: Refuse to deploy anything but production
        if: github.ref != 'refs/heads/production'
        run: exit 1
      - uses: actions/checkout@v7
      - name: Install kubectl and configure in-cluster access
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster --server=https://kubernetes.default.svc --certificate-authority="${SA_DIR}/ca.crt"
          kubectl config set-credentials deploy-sa --token="$(cat "${SA_DIR}/token")"
          kubectl config set-context in-cluster --cluster=in-cluster --user=deploy-sa --namespace=shop
          kubectl config use-context in-cluster

      - name: Update kube-setup manifest and deploy
        env:
          KUBE_SETUP_DEPLOY_TOKEN: ${{ secrets.KUBE_SETUP_DEPLOY_TOKEN }}
          IMAGE: ghcr.io/klaushofrichter/shop@${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf /tmp/kube-setup-deploy
          trap 'rm -rf /tmp/kube-setup-deploy' EXIT
          # The token never goes into a URL, argv or .git/config: git reads
          # an Authorization header from GIT_CONFIG_* (printf is a builtin).
          B64=$(printf 'x-access-token:%s' "$KUBE_SETUP_DEPLOY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          git clone -q https://github.com/klaushofrichter/kube-setup.git /tmp/kube-setup-deploy
          cd /tmp/kube-setup-deploy
          M=manifests/shop/shop-deployment.yaml
          sed -i "s|image: ghcr.io/klaushofrichter/shop[@:].*|image: ${IMAGE}|" "$M"
          grep -q "image: ${IMAGE}$" "$M" || { echo "::error::manifest image line did not update"; exit 1; }
          git config user.name "shop-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$M"
          if git diff --cached --quiet; then
            echo "Manifest already at ${IMAGE}; nothing to commit."
          else
            git commit -m "Deploy shop v${VERSION}"
            git push   # push before apply, always
          fi
          kubectl apply -f "$M"

      # The runner may only get/watch/patch deployments/shop, so
      # `kubectl rollout status` (which lists) is not allowed: poll instead.
      - name: Wait for the rollout
        id: rollout
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            read -r gen observed updated available <<<"$(kubectl get deployment shop -n shop \
              -o jsonpath='{.metadata.generation} {.status.observedGeneration} {.status.updatedReplicas} {.status.availableReplicas}')"
            echo "generation=${gen} observed=${observed} updated=${updated:-0} available=${available:-0}"
            if [ "$gen" = "$observed" ] && [ "${updated:-0}" = 1 ] && [ "${available:-0}" = 1 ]; then
              echo "generation=${gen}" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "::error::shop did not roll out in 5 minutes"; exit 1

      - name: Smoke-test the public endpoint
        id: smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          URL=https://shop.klaushofrichter.net
          for _ in $(seq 1 24); do
            served=$(curl -sf --max-time 5 "$URL/health" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1 || true)
            echo "served version: ${served:-none}"
            [ "$served" = "$VERSION" ] && break
            sleep 5
          done
          [ "$served" = "$VERSION" ] || { echo "::error::shop serves ${served:-nothing}, expected ${VERSION}"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 10 "$URL/health")
          [ "$code" = 200 ] || { echo "::error::HEAD /health answered ${code}"; exit 1; }
          enc=$(curl -s -o /dev/null -H 'Accept-Encoding: gzip, br' -w '%header{content-encoding}' --max-time 10 "$URL/")
          case "$enc" in gzip|br) ;; *) echo "::error::the home page arrived without compression (${enc:-none})"; exit 1;; esac
          echo "served=${served}" >> "$GITHUB_OUTPUT"


  publish:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          GENERATION: ${{ needs.deploy.outputs.generation }}
          SERVED: ${{ needs.deploy.outputs.served }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released - skipping."; exit 0
          fi
          : > /tmp/notes.md
          awk '/^## \[?Unreleased\]?/ { grab = 1; next } grab && /^## / { exit } grab { print }' CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/curated.md
          if [ -s /tmp/curated.md ]; then cat /tmp/curated.md >> /tmp/notes.md; printf '\n' >> /tmp/notes.md; fi
          printf '\nImage: `ghcr.io/klaushofrichter/shop:%s` (`@%s`)\n' "$TAG" "$DIGEST" >> /tmp/notes.md
          {
            printf '\n### Verified at release\n\n'
            printf -- '- deployment `shop` rolled out: generation %s, 1 updated and available replica\n' "$GENERATION"
            printf -- '- `/health` served version `%s`; HEAD /health 200; the home page arrived compressed\n' "$SERVED"
          } >> /tmp/notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file /tmp/notes.md
      # The notes harvested [Unreleased]; empty it on main (as cams does).
      - name: Reset the Unreleased changelog on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf /tmp/main
          B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          git clone -q --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/main
          cd /tmp/main
          awk '
            /^## \[Unreleased\]/ { print; print ""; skip = 1; next }
            skip && /^## / { skip = 0 }
            !skip { print }
          ' CHANGELOG.md > CHANGELOG.new
          if cmp -s CHANGELOG.md CHANGELOG.new; then echo "Unreleased already empty"; exit 0; fi
          mv CHANGELOG.new CHANGELOG.md
          git config user.name "shop-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "chore: clear Unreleased after v${VERSION}"
          git push || echo "::warning::could not clear [Unreleased] on main; clear it by hand"
