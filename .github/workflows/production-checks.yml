name: PR checks

# Both branches: Dependabot's PRs to main get checked too, not only the
# promotion to production.
on:
  pull_request:
    branches: [main, production]

# Least privilege; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
      # Blocking: what ships (the production image), no exceptions.
      - run: npm audit --omit=dev --audit-level=high
      # Blocking too: everything, dev dependencies included, at high, with an
      # allowlist by advisory id in .github/audit-allowlist.json (empty). The
      # gate (copied from cams-admin) fails when an allowlisted advisory goes
      # away or its package gets a new release, so entries don't linger.
      - name: npm audit (all dependencies, with the allowlist)
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/audit.json"

  e2e:
    # The public-pages baseline (kube-setup docs/cluster-deployment-requirements.md
    # §4), adapted from klaushofrichter/art: the Docker image this commit builds,
    # in four browsers with axe-core, then Lighthouse on a phone profile. One
    # job, so the required check is the single `e2e` context. GitHub-hosted:
    # a browser on the in-cluster runner gets OOM-killed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Build and start the image
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t shop:e2e .
          docker run -d --name site --network host -e PORT=8080 shop:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for the image (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8080/health | tee /dev/stderr | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs site; exit 1; }
          # The image runs as uid 1000 on its own, without --user.
          [ "$(docker exec site id -u)" = 1000 ] || { echo "::error::the image does not run as uid 1000"; exit 1; }

      # Drop Google's apt source before --with-deps: one bad index there once
      # failed every e2e run for hours (art, 2026-09-09). Chrome stays for Lighthouse.
      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      # failOnFlakyTests fails this step if any test passed only on its retry.
      - name: Walk the site in four browsers
        env:
          BASE_URL: http://localhost:8080
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test

      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8080/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report*.report.html
          retention-days: 14

      - name: Server log when something failed
        if: failure()
        run: docker logs site || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
