name: PR checks

# Both branches: Dependabot's PRs to main get checked too, not only the
# promotion to production.
on:
  pull_request:
    branches: [main, production]

# Least privilege; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
      # Blocking: what ships (the production image), no exceptions.
      - run: npm audit --omit=dev --audit-level=high
      # Blocking too: everything, dev dependencies included, at high, with an
      # allowlist by advisory id in .github/audit-allowlist.json (empty). The
      # gate (copied from cams-admin) fails when an allowlisted advisory goes
      # away or its package gets a new release, so entries don't linger.
      - name: npm audit (all dependencies, with the allowlist)
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/audit.json"

  e2e:
    # The public-pages baseline (kube-setup docs/cluster-deployment-requirements.md
    # §4), adapted from klaushofrichter/art: the Docker image this commit builds,
    # in four browsers with axe-core, then Lighthouse on a phone profile. One
    # job, so the required check is the single `e2e` context. GitHub-hosted:
    # a browser on the in-cluster runner gets OOM-killed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Build and start the image
        env:
          E2E_COOKIE_SECRET: e2e-only-cookie-secret-not-a-real-one-0001
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t shop:e2e .
          # The mock services (fake art, mock Printful, mock Stripe) on the
          # runner, up before the shop so its start-up checks find them.
          SHOP_URL=http://localhost:8080 nohup npx tsx mocks/server.ts > "$RUNNER_TEMP/mocks.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9103/ && curl -s -o /dev/null http://localhost:9102/ && break
            echo "waiting for the mocks (${i}/30)"; sleep 1
          done
          # A test-only cookie secret and an example.com admin: the admin e2e mints
          # a real signed session cookie with them (no test login route exists).
          # Mock mode against the mocks; mock keys only (the shop refuses real ones).
          docker run -d --name site --network host -e PORT=8080 \
            -e COOKIE_SECRET="$E2E_COOKIE_SECRET" -e ALLOWED_EMAILS=e2e@example.com \
            -v "$PWD/e2e/fixtures:/e2e:ro" -e SOURCES_CONFIG=/e2e/sources.json -e SOURCES_REFRESH=on \
            -e MOCK_SOURCE_URL=http://localhost:9103 \
            -e PRINTFUL_BASE_URL=http://localhost:9101 -e PRINTFUL_TOKEN=mock_printful_e2e \
            -e STRIPE_API_BASE=http://localhost:9102 -e STRIPE_SECRET_KEY=mock_stripe_e2e \
            -e STRIPE_WEBHOOK_SECRET=mock-whsec-e2e shop:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for the image (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8080/health | tee /dev/stderr | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs site; exit 1; }
          # The image runs as uid 1000 on its own, without --user.
          [ "$(docker exec site id -u)" = 1000 ] || { echo "::error::the image does not run as uid 1000"; exit 1; }

      # The browsers run in Playwright's own image, which carries all three
      # and their system libraries. `playwright install --with-deps` instead
      # downloads ~140 MB of libraries from the runner's Ubuntu mirror, which
      # on 2026-11-24 ran at ~100 kB/s and hit the 25-minute limit (PR #2).
      # The tag follows the installed @playwright/test, so a Dependabot bump
      # can never leave the image and the test runner on different versions.
      # failOnFlakyTests fails this step if any test passed only on its retry.
      - name: Walk the site in four browsers
        env:
          E2E_COOKIE_SECRET: e2e-only-cookie-secret-not-a-real-one-0001
        run: |
          set -euo pipefail
          PW=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --network host --ipc=host -v "$PWD:/work" -w /work \
            -e CI=true -e E2E_MOCKS=1 -e BASE_URL=http://localhost:8080 -e EXPECT_VERSION=2099.01.01.1 -e E2E_COOKIE_SECRET \
            "mcr.microsoft.com/playwright:v${PW}-resolute" npx playwright test

      # Lighthouse uses the runner's preinstalled Google Chrome.
      # The image runs in mock mode, which says noindex on purpose (a test
      # shop must not be indexed); every other SEO audit still counts.
      - name: Lighthouse (Google PageSpeed) on a phone
        env:
          LH_SKIP_AUDITS: is-crawlable
        run: scripts/lighthouse-gate.sh http://localhost:8080/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report*.report.html
          retention-days: 14

      - name: Server log when something failed
        if: failure()
        run: |
          docker logs site || true
          cat "$RUNNER_TEMP/mocks.log" || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
